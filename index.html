<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano 30 Hari — Belajar Main Piano/Keyboard dari Kosong</title>
<meta name="description" content="Ebook webapp interaktif: belajar main piano/keyboard dalam 30 hari. Chord, chord progression & lagu kegemaran — tanpa guru, mengikut rentak sendiri.">
<style>
/* ============================================================
   Piano 30 Hari — Design System
   Tema: ivory piano + ink + aksen terracotta. Editorial, mesra umur semua.
   ============================================================ */
:root {
  --bg: #FBF7EF;
  --bg2: #F3EDE0;
  --ink: #2A231B;
  --muted: #7A6E5D;
  --line: #E5DCCB;
  --accent: #B4531F;
  --accent-dark: #8F3E14;
  --accent-soft: #F5E2D3;
  --ok: #4C7A4F;
  --ok-soft: #E2EFE3;
  --white-key: #FFFDF8;
  --black-key: #2A231B;
  --gold: #C99A3C;
  --shadow: 0 2px 10px rgba(42,35,27,.08);
  --shadow-lg: 0 10px 32px rgba(42,35,27,.14);
  --r: 14px;
  --serif: Georgia, 'Times New Roman', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 50;
  background: rgba(251,247,239,.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1080px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: linear-gradient(145deg, #2A231B, #4A3E30);
  display: grid; place-items: center; font-size: 19px;
  box-shadow: var(--shadow);
}
.brand b { font-family: var(--serif); font-size: 19px; letter-spacing: .2px; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.top .progress-wrap { flex: 1; max-width: 320px; margin-left: auto; }
.progress-label { font-size: 12px; color: var(--muted); text-align: right; margin-bottom: 3px; }
.progress-bar { height: 9px; background: var(--bg2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 99px; transition: width .5s ease;
}

/* ---------- Layout ---------- */
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
.hero { padding: 34px 0 10px; }
.hero .kicker { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
.hero h1 { font-family: var(--serif); font-size: clamp(34px, 6vw, 52px); line-height: 1.12; margin: 10px 0 14px; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p.lead { font-size: 19px; color: var(--muted); max-width: 56ch; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.pill {
  background: #fff; border: 1px solid var(--line); border-radius: 99px;
  padding: 7px 15px; font-size: 13.5px; color: var(--ink);
  box-shadow: var(--shadow);
}
.pill b { color: var(--accent); }

/* ---------- Week band ---------- */
.week-band {
  margin: 34px 0 14px; display: flex; align-items: baseline; gap: 14px;
}
.week-band h2 { font-family: var(--serif); font-size: 24px; }
.week-band .wk-sub { color: var(--muted); font-size: 14px; }
.week-line { border: none; border-top: 1px solid var(--line); margin: 6px 0 18px; }

/* ---------- Day rack ---------- */
.rack { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.day-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 16px 14px; cursor: pointer; position: relative;
  box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .18s ease;
  display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink);
}
.day-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.day-card .num {
  font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--accent); text-transform: uppercase;
}
.day-card h3 { font-family: var(--serif); font-size: 18px; line-height: 1.3; font-weight: 700; }
.day-card p { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.day-card .done-badge {
  position: absolute; top: 12px; right: 12px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--ok-soft); color: var(--ok);
  display: grid; place-items: center; font-size: 14px; font-weight: 700;
  border: 1px solid #CFE3D0;
}
.day-card.is-done { border-color: #CFE3D0; background: #FAFDF9; }

/* ---------- Day view ---------- */
.crumb { font-size: 13.5px; margin-bottom: 18px; }
.crumb a { color: var(--accent); text-decoration: none; font-weight: 600; }
.crumb span { color: var(--muted); }
.day-head { margin-bottom: 22px; }
.day-head .num { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
.day-head h1 { font-family: var(--serif); font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 8px 0 10px; }
.goal {
  background: var(--accent-soft); border: 1px solid #EED9C6; border-radius: 12px;
  padding: 12px 16px; font-size: 15.5px; margin-top: 12px;
}
.goal b { color: var(--accent-dark); }
section.lesson { margin: 30px 0; }
section.lesson h2 {
  font-family: var(--serif); font-size: 24px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
section.lesson h2 .no {
  display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none;
  background: var(--ink); color: var(--bg); border-radius: 10px; font-size: 16px;
  font-family: var(--sans); font-weight: 700;
}
section.lesson p { margin-bottom: 12px; }
section.lesson ul, section.lesson ol { margin: 0 0 12px 22px; }
section.lesson li { margin-bottom: 6px; }
.tip {
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--gold);
  border-radius: 10px; padding: 12px 16px; font-size: 15px; margin: 14px 0;
}
.tip b { color: var(--accent-dark); }
.kbd {
  display: inline-block; min-width: 24px; text-align: center;
  background: #fff; border: 1px solid var(--line); border-bottom-width: 3px;
  border-radius: 6px; padding: 1px 7px; font-size: .9em; font-weight: 700;
}

/* ---------- Widgets ---------- */
.widget {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); margin: 16px 0; overflow: hidden;
}
.widget-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg2);
}
.widget-head .wtitle { font-weight: 700; font-size: 15px; }
.widget-head .wsub { font-size: 12.5px; color: var(--muted); }
.widget-body { padding: 16px; }
.widget .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  font-family: var(--sans); font-size: 14.5px; font-weight: 600;
  background: var(--accent); color: #fff; border: none; border-radius: 10px;
  padding: 10px 18px; cursor: pointer; min-height: 44px;
  box-shadow: 0 2px 6px rgba(180,83,31,.3); transition: background .15s ease, transform .1s ease;
}
.btn:hover { background: var(--accent-dark); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: #fff; color: var(--accent-dark); border: 1.5px solid var(--accent); box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { padding: 6px 13px; min-height: 36px; font-size: 13px; border-radius: 8px; }
.chip-btn {
  font-size: 15px; font-weight: 700; padding: 9px 16px; min-width: 44px;
  border-radius: 10px; border: 1.5px solid var(--line); background: #fff;
  cursor: pointer; transition: all .15s ease;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.chip-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=range] { accent-color: var(--accent); }
.bpm-val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-dark); min-width: 40px; }

/* ---------- Keyboard ---------- */
.kb-shell { overflow-x: auto; padding: 6px 2px 2px; }
.kb {
  position: relative; display: flex; height: 150px; min-width: 480px;
  border-radius: 8px 8px 6px 6px; overflow: hidden;
  border: 2px solid var(--ink); background: var(--ink);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
}
.kb.small { height: 118px; }
.wk {
  flex: 1; position: relative; background: var(--white-key);
  border-right: 1px solid #D8D2C4; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 7px; font-size: 12px; font-weight: 700; color: #9A8F7B;
  transition: background .07s ease; border-radius: 0 0 4px 4px;
}
.wk:last-child { border-right: none; }
.wk:active, .wk.hit { background: var(--accent-soft); }
.wk.hl { background: var(--accent-soft); box-shadow: inset 0 -6px 0 var(--accent); }
.wk.hl::after {
  content: attr(data-lbl); position: absolute; top: 8px;
  background: var(--accent); color: #fff; border-radius: 99px;
  font-size: 10px; padding: 2px 8px; font-weight: 700;
}
.bk {
  position: absolute; top: 0; width: 6.4%; height: 60%;
  background: linear-gradient(180deg, #3A3128, var(--black-key) 20%);
  border-radius: 0 0 4px 4px; z-index: 5; cursor: pointer;
  border: 1px solid #1E1912; border-top: none;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 5px; font-size: 10px; font-weight: 700; color: #8D8272;
}
.bk:active, .bk.hit { background: var(--accent-dark); }
.bk.hl { background: var(--accent-dark); box-shadow: inset 0 -5px 0 var(--gold); }
.kb.hands .wk::before { font-size: 11px; color: #B3A88F; position: static; }

/* Song strip */
.strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.strip span {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 7px;
  padding: 3px 9px; font-size: 12.5px; font-weight: 700; color: var(--ink);
  transition: all .1s ease;
}
.strip span.on { background: var(--accent); border-color: var(--accent); color: #fff; transform: translateY(-2px); }

/* Metronome lamp */
.lamp {
  width: 16px; height: 16px; border-radius: 50%; background: var(--bg2);
  border: 1px solid var(--line); display: inline-block; vertical-align: middle;
}
.lamp.on { background: var(--accent); border-color: var(--accent); }

/* Checklist */
.check-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.check-item:last-child { border-bottom: none; }
.check-item input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.check-item label { cursor: pointer; }
.check-item.done label { color: var(--ok); text-decoration: line-through; }

/* ---------- Day footer nav ---------- */
.day-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; }
.day-nav a {
  flex: 1; max-width: 48%; background: #fff; border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 18px; text-decoration: none; color: var(--ink);
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.day-nav a:hover { transform: translateY(-2px); }
.day-nav .dir { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.day-nav b { font-family: var(--serif); font-size: 16px; }
.day-nav a.next { text-align: right; }

.finish {
  margin-top: 26px; background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; text-align: center; box-shadow: var(--shadow);
}
.finish .btn.done-btn { background: var(--ok); box-shadow: 0 2px 6px rgba(76,122,79,.3); width: 100%; max-width: 380px; }
.finish .btn.done-btn.is-done { background: var(--ok-soft); color: var(--ok); border: 1.5px solid var(--ok); box-shadow: none; }
.finish p { margin-top: 8px; font-size: 14px; color: var(--muted); }

footer.site {
  border-top: 1px solid var(--line); margin-top: 60px; padding: 26px 20px 40px;
  text-align: center; color: var(--muted); font-size: 13.5px;
}
footer.site b { color: var(--ink); }

@media (max-width: 560px) {
  .top-in { flex-wrap: wrap; gap: 8px; }
  .top .progress-wrap { order: 5; width: 100%; max-width: none; }
  .rack { grid-template-columns: 1fr 1fr; }
  .day-card h3 { font-size: 15px; }
  .day-card p { display: none; }
  .day-nav a { max-width: none; }
}

/* ============================================================
   MELODI — pesona comel (CSS-animated)
   ============================================================ */
.melodi-row { display: flex; align-items: center; gap: 14px; margin: 18px 0; }
.melodi-row.small { margin: 0; }
.melodi-row.in-head { margin: 0; }
.melodi-row.in-head .melodi { transform: scale(.62); margin: -10px -8px; }

.melodi { position: relative; width: 78px; height: 86px; flex: none; }
.m-body {
  position: absolute; top: 14px; left: 7px; width: 64px; height: 60px;
  background: radial-gradient(120% 120% at 30% 20%, #FFEFC9 0%, #F9D488 55%, #F0B95E 100%);
  border-radius: 50% 50% 46% 46%;
  box-shadow: inset 0 -4px 8px rgba(180,83,31,.18), 0 3px 6px rgba(42,35,27,.12);
  animation: m-float 3.2s ease-in-out infinite;
}
.m-note {
  position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  font-size: 26px; color: var(--accent); font-weight: 700; z-index: 2;
  text-shadow: 0 1px 0 rgba(255,255,255,.6);
  animation: m-sway 2.6s ease-in-out infinite;
}
.m-shadow {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 46px; height: 9px; background: rgba(42,35,27,.14);
  border-radius: 50%; animation: m-shadow 3.2s ease-in-out infinite;
}
.m-eye {
  position: absolute; top: 20px; width: 11px; height: 13px;
  background: var(--ink); border-radius: 50%;
  animation: m-blink 4.4s infinite;
}
.m-eye.l { left: 15px; } .m-eye.r { right: 15px; }
.m-eye::after {
  content: ''; position: absolute; top: 1.5px; left: 2px; width: 4px; height: 4px;
  background: #fff; border-radius: 50%;
}
.m-cheek {
  position: absolute; top: 33px; width: 9px; height: 6px;
  background: rgba(233,122,99,.55); border-radius: 50%;
}
.m-cheek.l { left: 9px; } .m-cheek.r { right: 9px; }
.m-mouth {
  position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
  width: 15px; height: 8px; border-bottom: 3px solid var(--ink);
  border-radius: 0 0 12px 12px; transition: all .2s ease;
}
.m-arm {
  position: absolute; top: 32px; width: 15px; height: 8px;
  background: #F0B95E; border-radius: 8px; transition: transform .25s ease;
}
.m-arm.l { left: -9px; transform: rotate(18deg); }
.m-arm.r { right: -9px; transform: rotate(-18deg); }

.melodi.happy .m-body { animation: m-jump .55s ease; }
.melodi.happy .m-mouth { width: 18px; height: 11px; border-bottom-width: 3.5px; }
.melodi.happy .m-arm.l { transform: rotate(-55deg); }
.melodi.happy .m-arm.r { transform: rotate(55deg); }
.melodi.happy .m-note { animation: m-sway 0.6s ease-in-out infinite; }
.melodi.happy .m-hearts { display: block; }
.melodi.sad .m-eye { height: 3px; top: 24px; border-radius: 3px; }
.melodi.sad .m-mouth { border: none; border-top: 3px solid var(--ink); border-radius: 12px 12px 0 0; width: 13px; }
.melodi.sad .m-body { animation: m-droop 1s ease forwards; }
.melodi.sad .m-arm.l { transform: rotate(40deg); top: 40px; }
.melodi.sad .m-arm.r { transform: rotate(-40deg); top: 40px; }
.melodi.wiggle .m-body { animation: m-wiggle .5s ease; }

.m-hearts { display: none; }
.m-hearts span {
  position: absolute; color: #E4584C; font-size: 15px; opacity: 0;
  animation: m-heart 1.1s ease-out forwards;
}
.m-hearts span:nth-child(1) { left: 8px; top: 4px; }
.m-hearts span:nth-child(2) { left: 34px; top: -8px; animation-delay: .12s; font-size: 12px; }
.m-hearts span:nth-child(3) { left: 58px; top: 6px; animation-delay: .22s; }

.m-bubble {
  position: relative; background: #fff; border: 1.5px solid var(--line);
  border-radius: 14px; padding: 10px 15px; font-size: 15px; max-width: 560px;
  box-shadow: var(--shadow); animation: m-bubble-in .35s ease;
}
.m-bubble::before {
  content: ''; position: absolute; left: -7px; top: 50%; margin-top: -7px;
  width: 12px; height: 12px; background: #fff;
  border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
  transform: rotate(45deg);
}

@keyframes m-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes m-shadow { 0%,100% { transform: translateX(-50%) scale(1); opacity: .9; } 50% { transform: translateX(-50%) scale(.82); opacity: .55; } }
@keyframes m-sway { 0%,100% { transform: translateX(-50%) rotate(-14deg); } 50% { transform: translateX(-50%) rotate(14deg); } }
@keyframes m-blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } 97% { transform: scaleY(1); } }
@keyframes m-jump { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-14px) scale(.96,1.06); } 60% { transform: translateY(0) scale(1.06,.94); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes m-droop { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(4px) rotate(-7deg); } }
@keyframes m-wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg) translateY(-3px); } 75% { transform: rotate(9deg) translateY(-3px); } }
@keyframes m-heart { 0% { opacity: 0; transform: translateY(6px) scale(.5); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) scale(1.15); } }
@keyframes m-bubble-in { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

/* ============================================================
   KUIZ
   ============================================================ */
.quiz-widget .widget-head { align-items: center; }
.q-progress { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.q-text { font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.35; margin-bottom: 12px; }
.q-opts { display: grid; gap: 8px; }
.q-opt {
  text-align: left; padding: 12px 16px; min-height: 44px;
  border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  cursor: pointer; font-family: var(--sans); font-size: 15.5px; color: var(--ink);
  transition: border-color .15s ease, background .15s ease;
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); background: #FFFCF5; }
.q-opt:disabled { cursor: default; }
.q-opt.correct { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.q-opt.correct::after { content: ' ✓'; color: var(--ok); }
.q-opt.wrong { border-color: #C0543F; background: #F9E4DD; animation: q-shake .35s ease; }
.q-why { margin-top: 12px; font-size: 14.5px; color: var(--ink); background: var(--bg2); border-radius: 10px; padding: 10px 14px; line-height: 1.5; }
.q-why .ok-txt { color: var(--ok); }
.q-why .bad-txt { color: #C0543F; }
.q-next { margin-top: 12px; }
.q-end { text-align: center; padding: 8px 0 4px; }
.q-score { font-family: var(--serif); font-size: 42px; font-weight: 700; color: var(--accent); line-height: 1; }
.q-end.perfect .q-score { color: var(--ok); animation: m-jump .55s ease; }
.q-end p { margin-top: 8px; font-size: 15px; }
.q-meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); letter-spacing: .5px; }
@keyframes q-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ============================================================
   PAPAN LAGU MELODI — sistem mata (nota → lagu penuh)
   ============================================================ */
.songboard {
  background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-lg); padding: 20px 22px 22px; margin: 26px 0 8px;
  position: relative; overflow: hidden;
}
.songboard::before {
  content: '♪ ♫ ♪'; position: absolute; right: 14px; top: 6px;
  font-size: 30px; color: var(--line); letter-spacing: 6px; pointer-events: none;
}
.sb-head .wtitle { font-family: var(--serif); font-size: 21px; font-weight: 700; }
.sb-head .wsub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.sb-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }

/* ===== audio.js ===== */
/* ============================================================
   Piano 30 Hari — Audio Engine
   Web Audio API synth (bunyi piano-ish, tiada fail audio).
   + helper teori muzik: not → frekuensi, parse simbol chord.
   ============================================================ */
const Audio30 = (() => {
  let ctx = null, master = null;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /* ---------- Not → MIDI → frekuensi ---------- */
  const PC = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  function midiOf(name) { // "C4" → 60
    const m = /^([A-G][#b]?)(-?\d)$/.exec(name);
    if (!m) return 60;
    return (parseInt(m[2], 10) + 1) * 12 + PC[m[1]];
  }
  function nameOf(m) { // 60 → "C4"
    return NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
  }
  function freqOf(name) {
    const midi = (typeof name === 'number') ? name : midiOf(name);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  /* ---------- Synth voice ---------- */
  function tone(f, t, dur, vol) {
    ensure();
    dur = dur || 0.8; vol = (vol == null) ? 0.5 : vol;
    const o1 = ctx.createOscillator(); // badan not
    const o2 = ctx.createOscillator(); // harmonic atas → rasa "ping" piano
    const o3 = ctx.createOscillator(); // sub lembut
    const g = ctx.createGain();
    const g2 = ctx.createGain(); g2.gain.value = 0.22;
    const g3 = ctx.createGain(); g3.gain.value = 0.30;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(7000, f * 7);

    o1.type = 'triangle'; o1.frequency.value = f;
    o2.type = 'sine';     o2.frequency.value = f * 2;
    o3.type = 'sine';     o3.frequency.value = f * 0.5;

    o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
    g.connect(lp); lp.connect(master);

    const a = 0.006, rel = Math.max(dur, 0.22);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.12 * vol, t + rel * 0.65);
    g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    [o1, o2, o3].forEach(o => { o.start(t); o.stop(t + rel + 0.05); });
  }

  function now() { ensure(); return ctx.currentTime + 0.02; }
  function playNote(name, when, dur, vol) { tone(freqOf(name), now() + (when || 0), dur, vol); }

  /* ---------- Metronome click ---------- */
  function click(when, accent) {
    ensure();
    const t = now() + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = accent ? 1660 : 1180;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(accent ? 0.42 : 0.24, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.1);
  }

  return { ensure, now, tone, click, playNote, freqOf, midiOf, nameOf, NAMES };
})();

/* ============================================================
   Teori: parse simbol chord → not sebenar
   Format disokong: "C", "Am", "Gsus4", "Csus2", "Dm7", "G7",
   "F/C" (slash chord), "Fmaj7", "Bdim"
   ============================================================ */
const CHORD_QUAL = {
  '':      [0, 4, 7],
  'm':     [0, 3, 7],
  'sus2':  [0, 2, 7],
  'sus4':  [0, 5, 7],
  '7':     [0, 4, 7, 10],
  'm7':    [0, 3, 7, 10],
  'maj7':  [0, 4, 7, 11],
  'dim':   [0, 3, 6],
  'aug':   [0, 4, 8]
};

function parseChord(sym) {
  let bass = null, body = sym;
  if (sym.includes('/')) { const p = sym.split('/'); body = p[0]; bass = p[1]; }
  const m = /^([A-G][#b]?)(.*)$/.exec(body);
  if (!m) return { name: sym, notes: ['C4', 'E4', 'G4'], bass: null, sym: sym };
  const rootPc = Audio30.midiOf(m[1] + '4') - 60;
  const offs = CHORD_QUAL[m[2]] || CHORD_QUAL[''];
  const rootMidi = 60 + rootPc; // oktaf 4
  const notes = offs.map(o => Audio30.nameOf(rootMidi + o));
  const bassNote = bass ? Audio30.nameOf(60 + (Audio30.midiOf(bass + '3') - 48)) : null;
  return { name: body, sym, notes, bass: bassNote, formula: m[2] || 'major', root: m[1] };
}

/* Pecahkan chord ke posisi "kekal tangan" — root oktaf 4 + notes berdekatan */
function closeVoicing(ch) {
  const base = Audio30.midiOf(ch.notes[0]);
  return ch.notes.map((n, i) => Audio30.nameOf(base + CHORD_QUAL[ch.formula][i]));
}

      '<p>Petua membaca melodi: not bertema berulang. Baris pertama: <b>E D C D | E E E</b> — "Ma-ry had a lit-tle lamb". Perhatikan pattern simetri.</p>' },
    { h: 'Main bersama player', body:
      '<p>Tekan Main — kekunci akan menyala ikut melodi, dan jalur not di bawah menunjukkan urutan. Ikut dengan mata dulu, kemudian main bersama.</p>',
      w: { t: 'song', id: 'mary' } },
    { h: 'Cara menghafal dengan pantas', body:
      '<p>Pecahkan lagu kepada frasa 4 bar. Lengkapkan frasa 1 sebelum pindah ke frasa 2. Lagu = 4 frasa pendek, bukan 30 not panjang!</p>' }
  ],
  practice: 'Latihan (20 minit): Main Mary Had a Little Lamb dengan tangan kanan, 3 kali berturut-turut tanpa silap, ikut metronome 80 BPM jika boleh.' },

{ n: 7, week: 1, emoji: '✅', title: 'Ujian Minggu 1',
  goal: 'Semak kemahiran minggu ini sebelum kita masuk ke dunia chord — tick apa yang sudah anda kuasai.',
  secs: [
    { h: 'Senarai semak kemahiran', body:
      '<p>Tandakan apa yang sudah boleh anda buat. Yang belum, tak apa — ulang hari berkenaan esok. Akses semua hari sentiasa terbuka (self-paced!).</p>',
      w: { t: 'check', id: 'w1', items: [
        'Saya boleh nama semua not putih (C D E F G A B) tanpa tengok nota',
        'Saya jumpa Middle C dalam 3 saat',
        'Saya boleh main skala C major tangan kanan tanpa silap',
        'Saya boleh main 5-not dengan kedua-dua tangan serentak',
        'Saya boleh main Mary Had a Little Lamb tanpa berhenti'
      ] } },
    { h: 'Sudah siap? Raikan!', body:
      '<div class="tip"><b>Ini bukan kecil!</b> Majoriti orang yang mahu belajar piano berhenti sebelum sampai di sini. Minggu depan anda akan mula bermain <i>chord</i> — sebab sebenar orang boleh main lagu kegemaran mereka.</div>' },
    { h: 'Malam ini', body:
      '<p>Anda boleh bebas bermain di keyboard bawah — dengar, cuba, bermain tanpa takut silap. Bermain tanpa nota pun sebahagian daripada belajar.</p>',
      w: { t: 'freeplay', lo: 'C3', hi: 'C6', mark: [] } }
  ],
  practice: 'Latihan (20 minit): Ulang mana-mana hari minggu ini yang paling anda perlukan + bebas bermain 5 minit.' },

/* ================= MINGGU 2 — DUNIA CHORD ================= */
{ n: 8, week: 2, emoji: '🧱', title: 'Apa Itu Chord?',
  goal: 'Hari ini rahsia muzik pop dibuka: chord. Anda akan main chord PERTAMA anda dan faham cara ia dibina.',
  secs: [
    { h: 'Satu chord = 3 not ditekan serentak', body:
      '<p><b>Chord</b> ialah sekumpulan not dimainkan bersama — "blok bangunan" lagu. Sambil penyanyi menyanyi melodi, pemain keyboard menyokong dengan chord. Kuasai chord, dan anda boleh main hampir semua lagu pop.</p>' +
      '<p>Chord paling biasa ialah <b>triad</b>: 3 not. Formula Major triad dari root: <b>+4 semitone, kemudian +3 semitone</b>.</p>' +
      '<p>Contoh, C Major: mula dari C → naik 4 semitones (lepasi C#, D, D#) → sampai <b>E</b> → naik 3 lagi → <b>G</b>. Jadi C major = <b>C + E + G</b>.</p>' },
    { h: 'Main chord pertama anda', body:
      '<p>Tekan butang — tiga not akan menyala dan berbunyi bersama. Itu bunyi <b>C major</b> — bunyi paling "gembira" dalam muzik Barat.</p>',
      w: { t: 'chord', syms: ['C'], label: 'Chord C Major — C E G (jari 1-3-5)' } },
    { h: 'Kuasai chord', body:
      '<p>Main C major dengan jari tangan kanan: <b>1 (ibu jari) di C, 3 di E, 5 di G</b>. Tekan-lepas-tekan-lepas 10 kali. Rasakan bentuknya — bentuk inilah yang anda akan "membawa" ke semua tempat keyboard.</p>' }
  ],
  practice: 'Latihan (15 minit): Chord C major, tangan kanan 1-3-5, tekan-lepas ×10, kemudian cuba tanpa tengok tangan.' },

{ n: 9, week: 2, emoji: '🔑', title: 'Tiga Chord Emas: C, F, G',
  goal: 'Dengan 3 chord ini sahaja, anda boleh main ratusan lagu. Ya, betul — tiga.',
  secs: [
    { h: 'Keluarga Key of C', body:
      '<p>Lagu dalam "key of C" lazimnya membina dari 3 chord utama: <b>C</b> (rumah / I), <b>F</b> (IV) dan <b>G</b> (V). Ahli muzik memanggilnya "three-chord song" — dan anda sudah pun boleh membina banyak lagu tradisional dan pop klasik dengannya.</p>' +
      '<ul><li><b>C</b> = C E G</li><li><b>F</b> = F A C</li><li><b>G</b> = G B D</li></ul>' +
      '<p>Perhatikan: bentuk jari <i>hampir sama</i>, cuma berpindah. Jari anda akan menghafal "jalan" ini.</p>' },
    { h: 'Tiga chord, satu skrin', body:
      '<p>Klik setiap butang chord — kekunci menyala menunjukkan not. Kemudian tekan "Main ketiga-tiga" untuk dengar urutan C → F → G → C (bunyi "pulang ke rumah").</p>',
      w: { t: 'chord', syms: ['C', 'F', 'G'], label: 'Tiga Chord Emas' } },
    { h: 'Latihan peralihan', body:
      '<div class="tip"><b>Drill peralihan:</b> main C → F → C → G → C, ulang-ulang. Pergeseran silap di <i>antara</i> chord — bukan pada chord. Fokus memandang not SEA yang mahu didatangi, bukan tangan anda sekarang.</div>' }
  ],
  practice: 'Latihan (20 minit): Kitaran C-F-C-G-C ×10 perlahan. Matlamat: bertukar chord tanpa berhenti.' },

{ n: 10, week: 2, emoji: '🌧️', title: 'Chord Minor: Am, Dm, Em',
  goal: 'Kuasai "senyap sedih" muzik — chord minor — dan dengar beza besar daripada 1 semitones sahaja.',
  secs: [
    { h: 'Major = ceria, Minor = pilu', body:
      '<p>Beza C major dan C minor hanyalah <b>satu semitones</b> (E → Eb), tetapi perasaan berubah sepenuhnya. Itulah kuasa chord: formula kecil, kesan emosi besar.</p>' +
      '<p>Formula minor triad: <b>+3 semitones, kemudian +4</b> — songsang daripada major.</p>' +
      '<p>Dalam key of C, chord minor yang penting: <b>Am</b> (A C E), <b>Dm</b> (D F A), <b>Em</b> (E G B).</p>' },
    { h: 'Banding sendiri', body:
      '<p>Main C, kemudian Am. Dengar bagaimana satu not berubah (E→E? no — tengok jari: C E G → A C E, "rumah" sama tapi rasa lain!). Uji setiap chord minor di bawah.</p>',
      w: { t: 'chord', syms: ['C', 'Am', 'F', 'Dm', 'G', 'Em'], label: 'Major vs Minor — dengar beza' } },
    { h: 'Mengapa belajar minor sekarang?', body:
      '<p>Kerana hampir tiada lagu hit yang major sahaja. Chorus gembira, verse emosi — campuran major + minor itulah resepinya. Besok anda akan main progression yang mengandungi semua ini.</p>' }
  ],
  practice: 'Latihan (15 minit): Main Am, Dm, Em ×5 setiap satu, kemudian urutan C-Am-F-G ×5.' },

{ n: 11, week: 2, emoji: '⭐', title: 'Progression Paling Popular di Dunia',
  goal: 'Hari ini anda main I–V–vi–IV (C-G-Am-F) — progression yang membuatkannya ratusan lagu hit terkenal.',
  secs: [
    { h: 'Formula ajaib', body:
      '<p>Chord <b>progression</b> = urutan chord yang berulang mengikut rentak. Dan progression ini: <b>I–V–vi–IV</b> dalam key of C = <b>C → G → Am → F</b>.</p>' +
      '<p>Lagu yang menggunakannya (atau versi saudaranya vi–IV–I–V): "Let It Be", "Someone Like You", "Someone You Loved", "No Woman No Cry", berpuluh lagu Melayu pop & evergreen… Ramai orang memanggilnya <b>"progression 4 chord"</b>.</p>' },
    { h: 'Main progression ini', body:
      '<p>Progression player di bawah memainkan C-G-Am-F berulang, dengan kekunci menyala mengikut chord. Tukar "pattern" untuk dengar iringan berlainan. Cuba juga <b>versi iringan</b>: block chord dulu, kemudian pattern.</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'block', bpm: 80, loop: 8 } },
    { h: 'Nyanyi atasnya', body:
      '<div class="tip"><b>Ujian telinga:</b> main progression ini dan cuba nyanyi lagu kegemaran anda di atasnya. Hampa jadi C-G-Am-F adalah bahasa muzik pop sejagat — kebanyakan melodi akan muat dengan achaun yang mengejutkan.</div>' }
  ],
  practice: 'Latihan (20 minit): Main C-G-Am-F dengan tangan kanan, 8 pusingan tanpa berhenti. Kemudian cuba nyanyi sebaris lagu kesukaan di atasnya.' },

{ n: 12, week: 2, emoji: '🎹', title: 'Tangan Kiri Menyokong',
  goal: 'Mula bunyi macam dua orang bermain: tangan kanan chord/melodi, tangan kiri menyokong dengan bass.',
  secs: [
    { h: 'Pembahagian kerja', body:
      '<p>Resepi standard pemain keyboard:</p>' +
      '<ul><li><b>Tangan kiri:</b> main root chord (not nama chord) di oktaf rendah — memberikan "bumi".</li>' +
      '<li><b>Tangan kanan:</b> chord penuh — memberikan "badan".</li></ul>' +
      '<p>Contoh untuk chord C: LH main <b>C3</b> (atau C2), RH main <b>C4 E4 G4</b>.</p>' },
    { h: 'Pattern "boom-chick"', body:
      '<p>Pattern paling asas dan paling digunakan: <b>boom</b> (tangan kiri root) pada beat 1 & 3, <b>chick</b> (chord tangan kanan) pada beat 1-2-3-4 atau 2 & 4. Player di bawah menunjukkan versi 8-nota pop.</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'beat8', bpm: 80, loop: 8 } },
    { h: 'Jangan tengok tangan', body:
      '<div class="tip"><b>Tip:</b> tangan kiri hanya perlu "melompat" antara beberapa root sahaja. Hafal jarak: C→G jauh sikit, G→Am dekat, Am→F dekat. Sekali otot anda menghafal, mata bebas untuk baca lirik atau sheet!</div>' }
  ],
  practice: 'Latihan (20 minit): LH root + RH chord untuk C-G-Am-F, 8 pusingan. Perlahan dulu, kemudian 80 BPM.' },

{ n: 13, week: 2, emoji: '🔄', title: 'Inversions — Jalan Pintas Chord',
  goal: 'Berhenti melompat seluruh keyboard! Inversion membolehkan tangan anda bergerak minimum tetapi chord tetap bertukar.',
  secs: [
    { h: 'Chord yang sama, susunan berbeza', body:
      '<p><b>Inversion</b> = susunan not chord yang berbeza. C major = C E G, tetapi boleh juga dimainkan <b>E G C</b> (1st inversion) atau <b>G C E</b> (2nd inversion). Bunyinya tetap "chord C" — hanya "warna" dan kedudukan berbeza.</p>' },
    { h: 'Mengapa ia hebat?', body:
      '<p>Bayangkan main C → F tanpa inversion: tangan melompat jauh. Dengan inversion, main C (C E G) → <b>F/C</b> (C F A) — hampir tak bergerak! Ahli piano menggunakan inversion untuk <b>peralihan licin</b>.</p>' },
    { h: 'Lihat & dengar', body:
      '<p>Butang di bawah menunjukkan C, C/E dan C/G — chord sama, susunan lain. Kemudian cuba pasangan "licin": C → C/E → C/G.</p>',
      w: { t: 'chord', syms: ['C', 'C/E', 'C/G', 'F/C', 'G/B'], label: 'Chord & inversions' } },
    { h: 'Jalan licin C-G-Am-F', body:
      '<p>Versi inversion untuk progression kegemaran kita: C → <b>G/B</b> → <b>Am</b> → <b>F/C</b>. Perhatikan betapa kecilnya pergerakan tangan. Ini rahsia bunyi "pro".</p>',
      w: { t: 'prog', chords: ['C','G/B','Am','F/C'], pattern: 'block', bpm: 80, loop: 4 } }
  ],
  practice: 'Latihan (20 minit): Main C-G-Am-F versi inversion ×5. Rasakan beza "melompat" vs "licin".' },

{ n: 14, week: 2, emoji: '✅', title: 'Ujian Minggu 2',
  goal: 'Sahkan kemahiran chord anda — ini kemahiran yang membuka pintu ke hampir semua lagu pop.',
  secs: [
    { h: 'Play-along ujian', body:
      '<p>Main bersama progression di bawah dengan tangan kanan (chord) atau dua tangan (root + chord). Ikut seberapa banyak pusingan yang anda mampu.</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'beat8', bpm: 90, loop: 8 } },
    { h: 'Senarai semak', body:
      '<p>Tandakan kemahiran yang sudah ada. Jika ada yang belum, ulang hari tersebut esok — semua orang mengikut rentak sendiri.</p>',
      w: { t: 'check', id: 'w2', items: [
        'Saya boleh main 6 chord: C, F, G, Am, Dm, Em tanpa tengok nota',
        'Saya tahu beza bunyi major vs minor',
        'Saya boleh main progression C-G-Am-F tanpa berhenti',
        'Saya boleh main LH root + RH chord serentak',
        'Saya faham apa itu inversion dan bila ia berguna'
      ] } },
    { h: 'Antara anda dan main lagu…', body:
      '<div class="tip"><b>Minggu depan:</b> kita gabungkan semua ini dengan <i>melodi</i>. Anda sudah memiliki "kereta" (chord) — sekarang kita pasang "enjin" (lagu penuh).</div>' }
  ],
  practice: 'Latihan (20 minit): Ulang hari paling lemah minggu ini + play-along progression 5 minit.' },

/* ================= MINGGU 3 — MAIN LAGU KESESUKAAN ================= */
{ n: 15, week: 3, emoji: '📜', title: 'Baca Lead Sheet & Chord Chart',
  goal: 'Belajar "peta" lagu — supaya mana-mana lagu baru hanya ambil 2 minit untuk faham.',
  secs: [
    { h: 'Dua cara membaca muzik', body:
      '<p><b>Nota staf</b> (sheet music klasik) — tepat, tetapi lambat dipelajari. <b>Lead sheet / chord chart</b> — cuma tulis nama chord + lirik. Inilah cara pemain pop, band wedding dan pemain bar bermain ratusan lagu.</p>' +
      '<p>Kerana anda sudah tahu chord, anda boleh baca chord chart SEKARANG.</p>' },
    { h: 'Anatomi lagu', body:
      '<ul><li><b>Intro</b> — pembuka (biasanya progression sama dengan verse)</li>' +
      '<li><b>Verse</b> — bahagian bercerita (lazimnya lebih tenang)</li>' +
      '<li><b>Chorus</b> — bahagian "top" lagu, diulang (lazimnya paling emosional)</li>' +
      '<li><b>Bridge</b> — kejutan sebelum chorus terakhir</li></ul>' +
      '<p>Sekarang, apabila anda dengar lagu, cuba dengar bila ia "bertukar bahagian" — itu bila chord bertukar pattern.</p>' },
    { h: 'Chord chart pertama anda', body:
      '<p>Di bawah ialah "chart" lagu contoh. Main dan dengar strukturnya: setiap bar = 4 beat, setiap chord sebaris. Notasi chart yang sama digunakan oleh pemain profesional.</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'block', bpm: 80, loop: 4, chartTitle: 'Contoh chart — Verse: C G Am F (×4)' } }
  ],
  practice: 'Latihan (15 minit): Pilih satu lagu kegemaran, cari chord chart dia di internet (cuba cari "chord [nama lagu]"), dan lihat berapa banyak chord yang anda sudah tahu!' },

{ n: 16, week: 3, emoji: '✨', title: 'Teknik Melodi + Chord',
  goal: 'Hari ini anda main lagu dengan "penuh": melodi tangan kanan, chord/root tangan kiri.',
  secs: [
    { h: 'Resepi lengkap', body:
      '<p>Inilah formula pemain solo keyboard:</p>' +
      '<ul><li><b>Tangan kanan:</b> melodi lagu (not demi not)</li>' +
      '<li><b>Tangan kiri:</b> root chord atau chord penuh mengikut progression lagu</li></ul>' +
      '<p>Kedengaran seperti dua orang bermain — tetapi hanya anda seorang. Teknik ini dipanggil <i>melody + accompaniment</i>.</p>' },
    { h: 'Cuba dengan Ode to Joy', body:
      '<p>Main melodi Ode to Joy dengan tangan kanan. Untuk tangan kiri, main root chord: C… G… — cukup. Player menunjukkan melodi; progression di bawah sebagai contoh iringan.</p>',
      w: { t: 'song', id: 'ode' } },
    { h: 'Tangan kiri ikut deria', body:
      '<div class="tip"><b>Tip:</b> jangan bersusah payah menghafal chord setiap melodi — dengar bila terasa "bertukar rumah" di melodi, dan tukar chord saat itu. Untuk kebanyakan lagu, bertukar tiap 4 beat (satu bar).</div>' }
  ],
  practice: 'Latihan (20 minit): Ode to Joy RH melodi + LH root (C, G, C…). Perlahan, kemudian naik tempo.' },

{ n: 17, week: 3, emoji: '💃', title: 'Pattern Pop 8-Beat',
  goal: 'Berikan lagu anda denyut pop sebenar — pattern yang digunakan dalam beribu-ribu lagu.',
  secs: [
    { h: 'Dari "block" ke "alive"', body:
      '<p>Block chord (semua not serentak) berbunyi kaku. Pattern 8-beat memecahkan chord kepada 8 not setiap bar: <b>tum-tum-tum-tum</b> berterusan seperti jantung lagu pop.</p>' +
      '<p>Formula LH: root pada beat 1 & 3 ("boom"), chord pada beat 2 & 4 ("chick") — atau versi 8-nota penuh di player bawah.</p>' },
    { h: 'Dengar pattern ini', body:
      '<p>Player di bawah bermain C-G-Am-F dengan pattern 8-beat. Dengar bagaimana progression yang sama tiba-tiba berbunyi seperti lagu radio!</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'beat8', bpm: 90, loop: 8 } },
    { h: 'Lagu yang pakai pattern ini', body:
      '<p>Hampir semua pop ballad: "Let It Be", "Someone Like You", majoriti lagu M Nasir, Ella, Siti Nurhaliza yang tempo sederhana. Pattern yang sama — hanya kelajuan dan chord berbeza.</p>' }
  ],
  practice: 'Latihan (20 minit): Main C-G-Am-F dengan pattern 8-beat sendiri (LH boom-chick + RH chord), 100 BPM matlamat akhir minggu.' },

{ n: 18, week: 3, emoji: '🫧', title: 'Pattern Ballad & Waltz',
  goal: 'Belajar "rasa" 3-beat waltz dan pattern ballad lembut — warna baru untuk lagu anda.',
  secs: [
    { h: 'Waltz: 1-2-3, 1-2-3', body:
      '<p>Waltz dikira dalam <b>3/4</b> — tiga beat setiap bar: <b>BERAT</b>-lembut-lembut. Pattern: root dalam pada beat 1, chord pada beat 2 dan 3. Rasanya melayang, seperti kitaran zaman dulu.</p>' +
      '<p>Lagu waltz yang anda mungkin kenali: "Blue Danube", "Tennessee Waltz", majoriti lagu klasik Melayu asli seperti "Cenderawasih" dan rumba-rumba era P. Ramlee.</p>' },
    { h: 'Main waltz', body:
      '<p>Progression yang sama (C-G-Am-F) tetapi kali ini dalam rasa waltz. Dengar beza besar yang dibuat oleh <i>kiraan</i> sahaja!</p>',
      w: { t: 'prog', chords: ['C','G','Am','F'], pattern: 'waltz', bpm: 90, loop: 8 } },
    { h: 'Ballad lembut 6/8', body:
      '<p>Untuk lagu sangat emosi (contoh "Perfect" — Ed Sheeran), rasa 6/8: kira <b>1-2-3-4-5-6</b> dengan penekanan pada 1 dan 4. Pattern ballad: LH root + chord, tetapi dibuat lembut dan berlegar. Ia seperti waltz yang berlari dua kali lebih laju tapi lebih sepoi.</p>' }
  ],
  practice: 'Latihan (20 minit): Waltz LH root-chord-chord untuk C-G-Am-F ×5, kemudian cuba main pola sama atas lagu mana-mana lagu 3-beat yang anda tahu.' },

{ n: 19, week: 3, emoji: '🎨', title: 'Sus Chords & Warna',
  goal: 'Tambah "bumbuk" pada chord anda — sus2 dan sus4, garam & gula muzik pop.',
  secs: [
    { h: 'Chord yang "tergantung"', body:
      '<p><b>Sus</b> = suspended: gantikan not ke-3 chord dengan not ke-4 (sus4) atau ke-2 (sus2), menghasilkan bunyi "tergantung" yang menagih penyelesaian.</p>' +
      '<ul><li><b>Csus4</b> = C F G — bunyi "terbuka", sering di akhir frase</li>' +
      '<li><b>Csus2</b> = C D G — bunyi moden/misty, kegemaran pemain pop & film score</li></ul>' },
    { h: 'Cuba & banding', body:
      '<p>Main C, kemudian Csus4, kemudian balik C. Dengar bagaimana sus "bertanya" dan chord asal "menjawab". Trick yang sama dengan Gsus4 → G.</p>',
      w: { t: 'chord', syms: ['C', 'Csus4', 'Csus2', 'Gsus4', 'G'], label: 'Sus chords — dengar rasa tergantung' } },
    { h: 'Bila guna sus?', body:
      '<ul><li>Pada akhir baris lagu (sebelum pulang ke chorus)</li>' +
      '<li>Untuk "mengisi" saat pemain berhenti sekejap</li>' +
      '<li>Ganti chord asal pada verse untuk rasa lebih modern</li></ul>' +
      '<p>Contoh terkenal: intro "Pinball Wizard", "Summer of 69", banyak intro rock klasik.</p>' }
  ],
  practice: 'Latihan (15 minit): Main C-G-Am-F, tetapi tukar chord terakhir setiap pusingan kepada sus dan balik. Main "licin" tanpa berhenti.' },

{ n: 20, week: 3, emoji: '🚚', title: 'Transpose — Tukar Key',
  goal: 'Belajar pindahkan lagu ke key lain — supaya muat dengan suara anda atau penyanyi rakan.',
  secs: [
    { h: 'Mengapa tukar key?', body:
      '<p>Suara manusia ada julat berbeza. Lagu asal mungkin terlalu tinggi/rendah untuk anda nyanyikan. <b>Transpose</b> = alihkan semua chord dengan jarak yang sama, mengubah key tanpa mengubah lagu.</p>' +
      '<p>Kebaikan untuk pemain keyboard: <b>bentuk jari dan pattern TIDAK berubah</b> — hanya kedudukan berpindah. Kuasai progression di satu key, dan anda punyainya di SEMUA key.</p>' },
    { h: 'C → G: contoh klasik', body:

/* ============================================================
   MElODI — pesona CSS-animated
   ============================================================ */
function P30Melodi(msg, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'melodi-row' + (opts.small ? ' small' : '');

  const m = document.createElement('div');
  m.className = 'melodi';
  m.setAttribute('aria-hidden', 'true');
  m.innerHTML =
    '<div class="m-note">♪</div>' +
    '<div class="m-body">' +
      '<div class="m-eye l"></div><div class="m-eye r"></div>' +
      '<div class="m-cheek l"></div><div class="m-cheek r"></div>' +
      '<div class="m-mouth"></div>' +
      '<div class="m-arm l"></div><div class="m-arm r"></div>' +
    '</div>' +
    '<div class="m-shadow"></div>' +
    '<div class="m-hearts"><span>♥</span><span>♥</span><span>♥</span></div>';
  m._set = function (state, ms) { /* tukar ekspresi seketika */
    m.classList.remove('happy', 'sad');
    void m.offsetWidth;
    m.classList.add(state);
    if (ms) setTimeout(() => m.classList.remove(state), ms);
  };
  wrap.appendChild(m);

  if (msg) {
    const b = document.createElement('div');
    b.className = 'm-bubble';
    b.textContent = msg;
    wrap.appendChild(b);
  }
  wrap.melodi = m;
  return wrap;
}

/* ============================================================
   WIDGET KUIZ
   ============================================================ */
function P30QuizWidget(n) {
  const qs = P30_QUIZ[n];
  if (!qs) return document.createElement('span');

  const w = document.createElement('div');
  w.className = 'widget quiz-widget';
  const head = document.createElement('div');
  head.className = 'widget-head';
  const melodiRow = P30Melodi('', { small: true });
  melodiRow.classList.add('in-head');
  head.appendChild(melodiRow);
  head.insertAdjacentHTML('beforeend',
    '<div><div class="wtitle">🎮 Kuiz Hari ' + n + '</div>' +
    '<div class="wsub">Jawab & lihat Melodi react! Jawapan dihuraikan.</div></div>');
  w.appendChild(head);

  const body = document.createElement('div');
  body.className = 'widget-body';
  w.appendChild(body);

  const KEY = 'p30_quiz_d' + n;
  let best = 0;
  try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}

  let idx = 0, score = 0;

  function sfx(ok) {
    try {
      Audio30.ensure();
      if (ok) {
        Audio30.playNote('C5', 0, 0.18, 0.35);
        Audio30.playNote('E5', 0.09, 0.18, 0.35);
        Audio30.playNote('G5', 0.18, 0.5, 0.35);
      } else {
        Audio30.playNote('G3', 0, 0.3, 0.3);
        Audio30.playNote('F#3', 0.12, 0.45, 0.3);
      }
    } catch (e) {}
  }

  function renderQ() {
    body.innerHTML = '';
    if (idx >= qs.length) return renderEnd();

    const q = qs[idx];
    const correct = q.o[q.a];
    const order = q.o.map((t, i) => ({ t, i })).sort(() => Math.random() - 0.5);

    const prog = document.createElement('div');
    prog.className = 'q-progress';
    prog.textContent = 'Soalan ' + (idx + 1) + ' / ' + qs.length + ' · Skor terbaik: ' + best + '/' + qs.length;
    body.appendChild(prog);

    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = q.q;
    body.appendChild(qt);

    const opts = document.createElement('div');
    opts.className = 'q-opts';
    let answered = false;
    order.forEach(it => {
      const b = document.createElement('button');
      b.className = 'q-opt';
      b.textContent = it.t;
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const ok = it.i === q.a;
        if (ok) score++;
        body.querySelectorAll('.q-opt').forEach(x => x.disabled = true);
        if (ok) b.classList.add('correct');
        else {
          b.classList.add('wrong');
          body.querySelectorAll('.q-opt').forEach(x => { if (x.textContent === correct) x.classList.add('correct'); });
        }
        sfx(ok);
        melodiRow.melodi._set(ok ? 'happy' : 'sad', 1400);
        const why = document.createElement('div');
        why.className = 'q-why';
        why.innerHTML = (ok ? '<b class="ok-txt">Betul! 🎉</b> ' : '<b class="bad-txt">Belum tepat.</b> ') + q.w;
        body.appendChild(why);
        const next = document.createElement('button');
        next.className = 'btn small q-next';
        next.textContent = idx + 1 < qs.length ? 'Soalan seterusnya →' : 'Lihat skor saya →';
        next.onclick = () => { idx++; renderQ(); };
        body.appendChild(next);
      };
      opts.appendChild(b);
    });
    body.appendChild(opts);
  }

  function renderEnd() {
    const total = qs.length;
    if (score > best) { best = score; try { localStorage.setItem(KEY, String(best)); } catch (e) {} }
    const perfect = score === total;
    const msg = perfect ? 'PERFECT! Melodi melompat gembira! 🎉' :
                score > 0 ? 'Tidak buruk — baca huraian & cuba lagi untuk skor penuh!' :
                'Tak apa! Ulang pelajaran hari ni dan cuba semula ya 💪';
    body.innerHTML =
      '<div class="q-end' + (perfect ? ' perfect' : '') + '">' +
        '<div class="q-score">' + score + ' / ' + total + (perfect ? ' 🏆' : '') + '</div>' +
        '<p>' + msg + '</p>' +
        '<div class="q-meta">Skor terbaik anda: ' + best + '/' + total + '</div>' +
      '</div>';
    const again = document.createElement('button');
    again.className = 'btn small ghost';
    again.textContent = '↻ Cuba lagi';
    again.onclick = () => { idx = 0; score = 0; renderQ(); };
    body.appendChild(again);
    if (perfect) melodiRow.melodi._set('happy', 3000);
  }

  renderQ();
  return w;
}

/* ============================================================
   LAGU MELODI 🎵 — sistem mata: hari selesai + kuiz = NOTA
   30 hari = 30 nota. Mata kuiz tentukan kualiti nota:
   locked → plain (hari siap, kuiz belum) → silver (1/2) → gold (2/2)
   Milestone 7/14/21/30: melodi terkumpul DIMAINKAN sebenar.
   30/30: lagu penuh + confetti + graduation! 🎓
   ============================================================ */

/* Lagu asli Piano 30 Hari — AABA + koda, di atas dunia chord kita */
const SONG_MELODI = [
  'E4','G4','A4','G4','E4','D4','C4',          // Frasa 1 (M1) — C
  'E4','G4','A4','G4','E4','D4','C4',          // Frasa 2 (M2) — G
  'A4','C5','B4','A4','G4','E4','G4',         // Frasa 3 (M3) — Am
  'E4','G4','A4','G4','E4','D4','C4',         // Frasa 4 (M4) — F
  'D4','C4'                                    // koda — C (pulang)
];
const SONG_CHORDS = { 0: 'C', 7: 'G', 14: 'Am', 21: 'F', 28: 'C' }; // bass di frasa

function p30NoteState(day) {
  let done = false;
  try { done = (JSON.parse(localStorage.getItem('p30_done')) || []).includes(day); } catch (e) {}
  if (!done) return 'locked';
  let best = 0;
  try { best = +localStorage.getItem('p30_quiz_d' + day) || 0; } catch (e) {}
  if (best >= 2) return 'gold';
  if (best === 1) return 'silver';
  return 'plain';
}
function P30MataTotal() {
  let t = 0;
  for (let d = 1; d <= 30; d++) { try { t += +localStorage.getItem('p30_quiz_d' + d) || 0; } catch (e) {} }
  return t;
}
function P30UnlockedCount() {
  let n = 0;
  for (let d = 1; d <= 30; d++) if (p30NoteState(d) !== 'locked') n++;
  return n;
}

/* Main melodi terkumpul (nota 1..count) + backing chord di frasa */
function P30PlaySong(count) {
  count = Math.min(count, 30);
  const dt = 0.42;
  try {
    Audio30.ensure();
    for (let i = 0; i < count; i++) {
      const t = i * dt;
      Audio30.playNote(SONG_MELODI[i], t, dt * 1.35, 0.5);
      const ch = SONG_CHORDS[i];
      if (ch) {
        const c = parseChord(ch);
        Audio30.playNote(Audio30.nameOf(Audio30.midiOf(c.root + '3')), t, dt * 7, 0.22);
        c.notes.forEach(n => Audio30.playNote(n, t, dt * 7, 0.14));
      }
    }
  } catch (e) { /* pelayar tanpa Web Audio */ }
  /* animasi nota di papan jika ada */
  const notes = document.querySelectorAll('.snote');
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const n = notes[i];
      if (!n) return;
      n.classList.add('playing');
      setTimeout(() => n.classList.remove('playing'), 380);
    }, i * dt * 1000);
  }
  /* Melodi "menunjuk tangan" semasa lagu bermain */
  const m = document.querySelector('.melodi-row:not(.in-head) .melodi') || document.querySelector('.melodi');
  if (m) {
    const dur = count * dt * 1000;
    m.classList.add('conducting');
    setTimeout(() => m.classList.remove('conducting'), dur);
  }
}

/* Confetti — CSS sahaja, auto-buang */
function P30Confetti() {
  const c = document.createElement('div');
  c.className = 'p30-confetti';

/* ===== app.js ===== */
/* ============================================================
   Piano 30 Hari — App: router, renderer & widget interaktif
   Vanilla JS, tiada framework. Progress disimpan dalam localStorage.
   ============================================================ */
(() => {
  const $app = document.getElementById('app');
  const LS_DONE = 'p30_done';
  const timers = { all: [], byWidget: {} };

  /* ---------- util ---------- */
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const getDone = () => { try { return JSON.parse(localStorage.getItem(LS_DONE)) || []; } catch (e) { return []; } };
  const setDone = (arr) => { localStorage.setItem(LS_DONE, JSON.stringify(arr)); };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function schedule(widgetId, fn, ms) {
    const id = setTimeout(() => {
      (timers.byWidget[widgetId] = timers.byWidget[widgetId] || []).filter(x => x !== id);
      fn();
    }, ms);
    (timers.byWidget[widgetId] = timers.byWidget[widgetId] || []).push(id);
    timers.all.push(id);
  }
  function stopWidget(widgetId) {
    (timers.byWidget[widgetId] || []).forEach(clearTimeout);
    timers.byWidget[widgetId] = [];
  }
  function stopAllWidgets() { Object.keys(timers.byWidget).forEach(stopWidget); }

  /* ============================================================
     KEYBOARD BUILDER
     ============================================================ */
  function buildKeyboard(loName, hiName, opts) {
    opts = opts || {};
    const lo = Audio30.midiOf(loName), hi = Audio30.midiOf(hiName);
    const whites = [], blacks = [];
    for (let m = lo; m <= hi; m++) {
      (Audio30.NAMES[m % 12].length === 1 ? whites : blacks).push(m);
    }
    const kb = el('div', 'kb' + (opts.small ? ' small' : ''));
    kb.dataset.wcount = whites.length;
    const nW = whites.length;
    whites.forEach(m => {
      const k = el('div', 'wk', Audio30.NAMES[m % 12] + (Audio30.NAMES[m % 12] === 'C' ? (Math.floor(m / 12) - 1) : ''));
      k.dataset.midi = m;
      kb.appendChild(k);
    });
    blacks.forEach(m => {
      const wi = whites.indexOf(m - 1); // kekunci putih di sebelah kiri
      const k = el('div', 'bk', Audio30.NAMES[m % 12].replace('#', '♯'));
      k.dataset.midi = m;
      k.style.left = ((wi + 1) * 100 / nW - 3.2) + '%';
      kb.appendChild(k);
    });
    if (opts.onKey) {
      kb.addEventListener('pointerdown', ev => {
        const key = ev.target.closest('[data-midi]');
        if (!key) return;
        const m = +key.dataset.midi;
        flash(kb, [m], 180);
        const pm = document.querySelector('.melodi');
        if (pm) { pm.classList.remove('wiggle'); void pm.offsetWidth; pm.classList.add('wiggle'); }
        try {
          Audio30.ensure();
          Audio30.tone(Audio30.freqOf(m), Audio30.now(), 1.1, 0.5);
        } catch (e) { /* pelayar tanpa Web Audio */ }
        if (opts.onKey) opts.onKey(m);
      });
    }
    return kb;
  }
  const keyOf = (kb, m) => kb.querySelector('[data-midi="' + m + '"]');
  function hlKeys(kb, midis, labels) {
    clearHl(kb);
    midis.forEach((m, i) => {
      const k = keyOf(kb, m);
      if (k) { k.classList.add('hl'); if (labels && labels[i]) k.dataset.lbl = labels[i]; }
    });
  }
  function clearHl(kb) { kb.querySelectorAll('.hl').forEach(k => { k.classList.remove('hl'); delete k.dataset.lbl; }); }
  function flash(kb, midis, ms) {
    midis.forEach(m => { const k = keyOf(kb, m); if (k) k.classList.add('hit'); });
    setTimeout(() => midis.forEach(m => { const k = keyOf(kb, m); if (k) k.classList.remove('hit'); }), ms || 140);
  }
  /* julat keyboard yang memuat semua not + ruang sikit */
  function fitRange(names, pad) {
    pad = pad == null ? 2 : pad;
    const midis = names.map(n => Audio30.midiOf(n)).sort((a, b) => a - b);
    let lo = midis[0] - pad, hi = midis[midis.length - 1] + pad;
    while (Audio30.NAMES[lo % 12].length > 1) lo--; // snap ke kekunci putih
    while (Audio30.NAMES[hi % 12].length > 1) hi++;
    return [Audio30.nameOf(lo), Audio30.nameOf(hi)];
  }

  /* ============================================================
     WIDGETS
     ============================================================ */
  const W = {};

  /* ---- freeplay ---- */
  W.freeplay = (w, host, wid) => {
    const kb = buildKeyboard(w.lo || 'C3', w.hi || 'C6', { onKey: () => {}, small: false });
    if (w.mark && w.mark.length) {
      const lo = Audio30.midiOf(w.lo || 'C3'), hi = Audio30.midiOf(w.hi || 'C6');
      const midis = [];
      for (let m = lo; m <= hi; m++) if (w.mark.includes(Audio30.NAMES[m % 12])) midis.push(m);
      hlKeys(kb, midis, midis.map(() => '✨'));
    }
    const body = el('div', 'kb-shell'); body.appendChild(kb); host.appendChild(body);
  };

  /* ---- chord ---- */
  W.chord = (w, host, wid) => {
    const chords = w.syms.map(parseChord);
    const allNotes = chords.flatMap(c => c.notes).concat(chords.filter(c => c.bass).map(c => c.bass));
    const [lo, hi] = fitRange(allNotes);
    const kb = buildKeyboard(lo, hi, { small: true });
    const body = el('div', 'widget-body');
    const controls = el('div', 'controls');

    function showChord(i, play) {
      const c = chords[i];
      const notes = c.bass ? [c.bass].concat(c.notes) : c.notes;
      hlKeys(kb, notes.map(n => Audio30.midiOf(n)), notes.map((n, j) => j === 0 ? '1' : (j === 1 ? '3' : '5')));
      controls.querySelectorAll('.chip-btn').forEach((b, j) => b.classList.toggle('active', j === i));
      if (play) {
        Audio30.ensure();
        notes.forEach(n => Audio30.playNote(n, 0, 1.4, 0.34));
        flash(kb, notes.map(n => Audio30.midiOf(n)), 300);
      }
    }
    chords.forEach((c, i) => {
      const b = el('button', 'chip-btn', esc(c.sym));
      b.onclick = () => showChord(i, true);
      controls.appendChild(b);
    });
    if (chords.length > 1) {
      const all = el('button', 'btn small ghost', '▶ Main ketiga-tiga');
      all.onclick = () => {
        stopWidget(wid);
        chords.forEach((c, i) => {
          schedule(wid, () => showChord(i, true), i * 1300);
        });
      };
      controls.appendChild(all);
    }
    body.appendChild(controls);
    const shell = el('div', 'kb-shell'); shell.appendChild(kb); body.appendChild(shell);
    if (w.label) body.appendChild(el('p', 'wsub', esc(w.label)));
    host.appendChild(body);
    if (chords.length) showChord(0, false);
  };

  /* ---- scale ---- */
  W.scale = (w, host, wid) => {
    const notes = w.notes;
    const fingers = w.fingers ? w.fingers.split('-') : null;
    const [lo, hi] = fitRange(notes, 1);
    const kb = buildKeyboard(lo, hi, { small: true });
    const body = el('div', 'widget-body');
    const controls = el('div', 'controls');
    const btn = el('button', 'btn', '▶ Main ' + (w.label ? 'skala' : 'urutan'));
    const dt = 0.48;
    btn.onclick = () => {
      stopWidget(wid); Audio30.ensure();
      clearHl(kb);
      notes.forEach((n, i) => {
        Audio30.playNote(n, i * dt, dt * 1.4, 0.5);
        schedule(wid, () => hlKeys(kb, [Audio30.midiOf(n)], fingers ? [fingers[i]] : null), i * dt * 1000);
      });
      schedule(wid, () => clearHl(kb), notes.length * dt * 1000 + 900);
    };
    controls.appendChild(btn);
    if (w.label) controls.appendChild(el('span', 'wsub', esc(w.label)));
    body.appendChild(controls);
    const shell = el('div', 'kb-shell'); shell.appendChild(kb); body.appendChild(shell);
    if (w.desc) body.appendChild(el('p', 'wsub', esc(w.desc)));
    host.appendChild(body);
  };

  /* ---- prog / jam (chord progression + pattern) ---- */
  function progEvents(chordSyms, pattern, bpm, loopBars) {
    const beat = 60 / bpm;
    const beatsPerBar = pattern === 'waltz' ? 3 : 4;
    const barLen = beat * beatsPerBar;
    const ev = []; // {t, notes, dur, vol}
    const bars = [];
    for (let b = 0; b < loopBars; b++) bars.push(chordSyms[b % chordSyms.length]);
    bars.forEach((sym, bi) => {
      const c = parseChord(sym);
      const root3 = Audio30.nameOf(Audio30.midiOf(c.root + '3'));
      const t0 = bi * barLen;
      bars[bi] = { sym, c, t0, barLen };
      if (pattern === 'block') {
        ev.push({ t: t0, notes: [root3].concat(c.notes), dur: barLen, vol: 0.34 });
      } else if (pattern === 'beat8') {
        for (let k = 0; k < 8; k++) {
          const bassHit = k % 2 === 0;
          ev.push({
            t: t0 + k * beat / 2,
            notes: bassHit ? [root3] : c.notes,
            dur: beat * 0.7, vol: bassHit ? 0.42 : 0.26
          });
        }
      } else if (pattern === 'waltz') {
        ev.push({ t: t0, notes: [root3], dur: beat * 0.95, vol: 0.42 });
        ev.push({ t: t0 + beat, notes: c.notes, dur: beat * 0.9, vol: 0.26 });
        ev.push({ t: t0 + beat * 2, notes: c.notes, dur: beat * 0.9, vol: 0.26 });
      } else if (pattern === 'arp') {
        const seq = [root3, c.notes[1], c.notes[2], c.notes[1]];
        seq.forEach((n, k) => ev.push({ t: t0 + k * beat, notes: [n], dur: beat * 1.1, vol: 0.38 }));
      }
    });
    return { ev, bars, barLen, total: loopBars * barLen };
  }

  W.prog = W.jam = (w, host, wid) => {
    const pattern = w.pattern || 'block';
    const bpm = w.bpm || 80;
    const loopBars = w.loop || 8;
    const chords = w.chords.map(parseChord);
    const allNotes = chords.flatMap(c => c.notes);
    const [lo, hi] = fitRange(allNotes.concat(chords.map(c => Audio30.midiOf(c.root + '3') + '' ? Audio30.nameOf(Audio30.midiOf(c.root + '3')) : '')), 2);
    const kb = buildKeyboard(lo, hi, { small: true });
    const body = el('div', 'widget-body');
    const controls = el('div', 'controls');

    if (w.chartTitle) body.appendChild(el('p', 'wtitle', esc(w.chartTitle)));
    if (w.splitLabels) {
      const lg = el('div', 'controls');
      w.splitLabels.forEach((s, i) => lg.appendChild(el('span', 'pill', esc(s))));
      body.appendChild(lg);
    }

    const playBtn = el('button', 'btn', '▶ Main');
    const stopBtn = el('button', 'btn small ghost', '■ Stop');
    stopBtn.style.display = 'none';
    playBtn.onclick = () => {
      stopWidget(wid); Audio30.ensure();
      const { ev, bars, total } = progEvents(w.chords, pattern, bpm, loopBars);
      ev.forEach(e => {
        e.notes.forEach(n => Audio30.playNote(n, e.t, e.dur, e.vol));
        schedule(wid, () => flash(kb, e.notes.map(n => Audio30.midiOf(n)), 150), e.t * 1000);
      });
      bars.forEach(b => {
        schedule(wid, () => hlKeys(kb, b.c.notes.map(n => Audio30.midiOf(n)), null), b.t0 * 1000);
      });
      schedule(wid, () => { clearHl(kb); playBtn.style.display = ''; stopBtn.style.display = 'none'; }, total * 1000 + 600);
      playBtn.style.display = 'none'; stopBtn.style.display = '';
    };
    stopBtn.onclick = () => { stopWidget(wid); clearHl(kb); playBtn.style.display = ''; stopBtn.style.display = 'none'; };
    controls.appendChild(playBtn); controls.appendChild(stopBtn);
    controls.appendChild(el('span', 'wsub', pattern.toUpperCase() + ' · ' + bpm + ' BPM · ' + w.chords.join(' – ')));
    body.appendChild(controls);

    const shell = el('div', 'kb-shell'); shell.appendChild(kb); body.appendChild(shell);

    if (w.notes && w.notes.length) { // widget jam: serlahkan not pentatonic
      hlKeys(kb, w.notes.map(n => Audio30.midiOf(n)), w.notes.map(() => '★'));
    }
    if (w.pedalHint) body.appendChild(el('p', 'wsub', 'Petua pedal: angkat & tekan semula pada setiap pertukaran chord.'));
    host.appendChild(body);
  };

  /* ---- song ---- */
  W.song = (w, host, wid) => {
    const song = SONGS[w.id];
    const bpm = song.bpm || 90;
    const beat = 60 / bpm;
    const midis = song.notes.map(x => Audio30.midiOf(x[0]));
    const [lo, hi] = fitRange(song.notes.map(x => x[0]), 2);
    const kb = buildKeyboard(lo, hi, { small: true, onKey: null });
    const body = el('div', 'widget-body');
    const controls = el('div', 'controls');
    const playBtn = el('button', 'btn', '▶ Main lagu');
    const stopBtn = el('button', 'btn small ghost', '■ Stop');
    stopBtn.style.display = 'none';

    const strip = el('div', 'strip');
    song.notes.forEach(x => strip.appendChild(el('span', null, esc(x[0]))));

    playBtn.onclick = () => {
      stopWidget(wid); Audio30.ensure();
      const backing = song.chords ? progEvents(song.chords, 'block', bpm, song.chords.length) : null;
      if (backing) backing.ev.forEach(e => e.notes.forEach(n => Audio30.playNote(n, e.t, e.dur, 0.20)));
      let t = 0;
      song.notes.forEach((x, i) => {
        const [name, len] = x;
        Audio30.playNote(name, t, Math.min(len * beat * 0.92, beat * 3), 0.5);
        const at = t;
        schedule(wid, () => {
          clearHl(kb);
          hlKeys(kb, [midis[i]], null);
          flash(kb, [midis[i]], Math.min(len * beat * 800, 600));
          strip.querySelectorAll('span').forEach((s, j) => s.classList.toggle('on', j === i));
        }, at * 1000);
        t += len * beat;
      });
      schedule(wid, () => {
        clearHl(kb);
        strip.querySelectorAll('span').forEach(s => s.classList.remove('on'));
        playBtn.style.display = ''; stopBtn.style.display = 'none';
      }, t * 1000 + 700);
      playBtn.style.display = 'none'; stopBtn.style.display = '';
    };
    stopBtn.onclick = () => { stopWidget(wid); clearHl(kb); strip.querySelectorAll('span').forEach(s => s.classList.remove('on')); playBtn.style.display = ''; stopBtn.style.display = 'none'; };
    controls.appendChild(playBtn); controls.appendChild(stopBtn);
    controls.appendChild(el('span', 'wsub', esc(song.title) + ' · ' + bpm + ' BPM'));
    body.appendChild(controls);
    const shell = el('div', 'kb-shell'); shell.appendChild(kb); body.appendChild(shell);
    body.appendChild(strip);
    host.appendChild(body);
  };

  /* ---- metronome ---- */
  W.metro = (w, host, wid) => {
    const body = el('div', 'widget-body');
    const controls = el('div', 'controls');
    let bpm = w.bpm || 80;
    let playing = false, beatNo = 0, interval = null;

    const playBtn = el('button', 'btn', '▶ Main metronome');
    const slider = el('input'); slider.type = 'range'; slider.min = 40; slider.max = 180; slider.value = bpm;
    const val = el('span', 'bpm-val', bpm + '');
    const lamp = el('span', 'lamp');
    slider.oninput = () => {
      bpm = +slider.value; val.textContent = bpm;
      if (playing) { stop(); start(); }
    };
    function tick() {
      const accent = beatNo % 4 === 0;
      Audio30.click(0, accent);
      lamp.classList.add('on');
      setTimeout(() => lamp.classList.remove('on'), 70);
      beatNo++;
    }
    function start() {
      Audio30.ensure();
      playing = true; beatNo = 0;
      tick();
      interval = setInterval(tick, 60000 / bpm);
      playBtn.textContent = '■ Stop';
    }
    function stop() {
      playing = false;
      if (interval) clearInterval(interval); interval = null;
      playBtn.textContent = '▶ Main metronome';
    }
    playBtn.onclick = () => playing ? stop() : start();
    controls.appendChild(playBtn);
    controls.appendChild(lamp);
    controls.appendChild(slider);
    controls.appendChild(val);
    controls.appendChild(el('span', 'wsub', 'BPM'));
    body.appendChild(controls);
    host.appendChild(body);
  };

  /* ---- check ---- */
  W.check = (w, host, wid) => {
    const body = el('div', 'widget-body');
    const key = 'p30_check_' + (w.id || wid);
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(key)) || []; } catch (e) {}
    w.items.forEach((item, i) => {
      const row = el('div', 'check-item' + (saved[i] ? ' done' : ''));
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!saved[i];
      const lb = el('label', null, esc(item));
      const toggle = () => {
        saved[i] = cb.checked;
        localStorage.setItem(key, JSON.stringify(saved));
        row.classList.toggle('done', cb.checked);
      };
      cb.onchange = toggle;
      row.appendChild(cb); row.appendChild(lb);
      body.appendChild(row);
    });
    host.appendChild(body);
  };

  /* ============================================================
     RENDER
     ============================================================ */
  function renderHeader() {
    const done = getDone().length;
    const pct = Math.round(done / DAYS.length * 100);
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('plabel').textContent = done + '/30 hari · ' + pct + '%';
  }

  function renderHome() {
    stopAllWidgets();
    const done = getDone();
    const firstOpen = DAYS.find(d => !done.includes(d.n)) || DAYS[DAYS.length - 1];
    const app = el('div');
    if (window.P30Melodi) app.appendChild(P30Melodi(P30HomeGreeting(), {}));
    app.appendChild(el('div', 'hero',
      '<div class="kicker">Ebook interaktif · belajar sendiri · tanpa guru</div>' +
      '<h1>Belajar Main Piano & Keyboard<br>— <em>30 Hari</em></h1>' +
      '<p class="lead">Dari kosong terus ke lagu kegemaran anda. Fokus <b>chord &amp; chord progression</b> — cara paling pantas main lagu sebenar tanpa perlu membaca nota staf. Percuma, mengikut rentak sendiri, untuk semua umur.</p>' +
      '<div class="stats">' +
        '<span class="pill"><b>30</b> hari berstruktur</span>' +
        '<span class="pill"><b>8+</b> chord &amp; progression</span>' +
        '<span class="pill"><b>5</b> lagu repertoir</span>' +
        '<span class="pill">🎹 keyboard interaktif bawa sendiri</span>' +
      '</div>'));
    const cta = el('div', 'controls');
    cta.style.margin = '10px 0 6px';
    const start = el('button', 'btn', done.length ? '▶ Terus Hari ' + firstOpen.n : '▶ Mula Hari 1 — percuma!');
    start.onclick = () => { location.hash = '#/hari-' + firstOpen.n; };
    cta.appendChild(start);
    app.appendChild(cta);
    if (window.P30SongBoard) app.appendChild(P30SongBoard());

    let curWeek = 0;
    DAYS.forEach(d => {
      if (d.week !== curWeek) {
        curWeek = d.week;
        const wk = WEEKS[curWeek];
        app.appendChild(el('div', 'week-band', '<h2>Minggu ' + curWeek + ' — ' + esc(wk.title) + '</h2><span class="wk-sub">' + esc(wk.sub) + '</span>'));
        app.appendChild(el('hr', 'week-line'));
      }
      const card = el('a', 'day-card' + (done.includes(d.n) ? ' is-done' : ''));
      card.href = '#/hari-' + d.n;
      card.innerHTML = (done.includes(d.n) ? '<span class="done-badge">✓</span>' : '') +
        '<span class="num">Hari ' + d.n + '</span><h3>' + d.emoji + ' ' + esc(d.title) + '</h3><p>' + esc(d.goal) + '</p>';
      app.appendChild(card);
    });
    $app.innerHTML = '';
    $app.appendChild(app);
    renderHeader();
    window.scrollTo(0, 0);
  }

  function renderDay(n) {
    stopAllWidgets();
    const d = DAYS.find(x => x.n === n);
    if (!d) { renderHome(); return; }
    const done = getDone();
    const app = el('div');
    app.appendChild(el('div', 'crumb', '<a href="#/">← Rak Hari</a> &nbsp;·&nbsp; <span>Minggu ' + d.week + ' — ' + esc(WEEKS[d.week].title) + '</span>'));
    const head = el('div', 'day-head',
      '<div class="num">Hari ' + d.n + ' dari 30</div><h1>' + d.emoji + ' ' + esc(d.title) + '</h1>' +
      '<div class="goal"><b>🎯 Matlamat hari ini:</b> ' + esc(d.goal) + '</div>');
    app.appendChild(head);
    if (window.P30Melodi) app.appendChild(P30Melodi(P30ChatDay(n), {}));

    d.secs.forEach((s, i) => {
      const sec = el('section', 'lesson');
      sec.appendChild(el('h2', null, '<span class="no">' + (i + 1) + '</span>' + esc(s.h)));
      const body = el('div', null, s.body);
      sec.appendChild(body);
      if (s.w) {
        const wid = 'd' + n + 's' + i;
        const widget = el('div', 'widget');
        const title = ({
          freeplay: '🎹 Keyboard — cuba sendiri', chord: '🎼 Chord player', scale: '🪜 Scale player',
          prog: '🎶 Progression player', song: '🎵 Song player', metro: '🥁 Metronome',
          check: '✅ Senarai semak', jam: '🔥 Jam — main bebas'
        })[s.w.t] || 'Widget';
        widget.appendChild(el('div', 'widget-head', '<span class="wtitle">' + title + '</span>'));
        (W[s.w.t] || (h => {}))(s.w, widget, wid);
        sec.appendChild(widget);
      }
      app.appendChild(sec);
    });

    if (window.P30QuizWidget) app.appendChild(P30QuizWidget(n));
    app.appendChild(el('div', 'tip', '<b>📋 ' + esc(d.practice) + '</b>'));

    /* butang selesai */
    const fin = el('div', 'finish');
    const finBtn = el('button', 'btn done-btn' + (done.includes(n) ? ' is-done' : ''),
      done.includes(n) ? '✓ Hari ini selesai — teruskan!' : '✓ Tandakan Hari ' + n + ' selesai');
    finBtn.onclick = () => {
      const cur = getDone();
      const idx = cur.indexOf(n);
      if (idx >= 0) cur.splice(idx, 1); else cur.push(n);
      setDone(cur.sort((a, b) => a - b));
      renderHeader();
      const isDone = cur.includes(n);
      finBtn.classList.toggle('is-done', isDone);
      finBtn.textContent = isDone ? '✓ Hari ini selesai — teruskan!' : '✓ Tandakan Hari ' + n + ' selesai';
      if (isDone && window.P30OnDayDone) P30OnDayDone(n);
    };
    fin.appendChild(finBtn);
    fin.appendChild(el('p', null, 'Progress disimpan dalam pelayar anda — balik semula bila-bila masa.'));
    app.appendChild(fin);

    /* nav hari */
    const nav = el('div', 'day-nav');
    if (n > 1) {
      const p = DAYS.find(x => x.n === n - 1);
      nav.appendChild(el('a', null, '<div class="dir">← Sebelum</div><b>Hari ' + p.n + ': ' + esc(p.title) + '</b>')).href = '#/hari-' + (n - 1);
    }
    if (n < 30) {
      const nx = DAYS.find(x => x.n === n + 1);
      const a = el('a', 'next', '<div class="dir">Seterusnya →</div><b>Hari ' + nx.n + ': ' + esc(nx.title) + '</b>');
      a.href = '#/hari-' + (n + 1);
      nav.appendChild(a);
    }
    app.appendChild(nav);

    $app.innerHTML = '';
    $app.appendChild(app);
    renderHeader();
    window.scrollTo(0, 0);
  }

  function route() {
    const m = /^#\/hari-(\d+)/.exec(location.hash);
    if (m) renderDay(+m[1]); else renderHome();
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
